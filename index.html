.brand{font:800 13.5px Sora,sans-serif;letter-spacing:.2em;white-space:nowrap;background:linear-gradient(180deg,#fffdf5 0%,#ffe6a8 34%,#f0b429 56%,#a06f08 74%,#ffdf95 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 11px rgba(240,180,41,.6))}
.active{flex:0 0 auto;display:flex;align-items:center;gap:5px;font:700 6.8px JetBrains Mono,monospace;letter-spacing:.14em;color:var(--cyan-2);padding:4px 9px;border-radius:999px;border:1px solid rgba(255,215,120,.42);background:linear-gradient(180deg,rgba(240,180,41,.16),rgba(240,180,41,.05));box-shadow:inset 0 1px 0 rgba(255,250,235,.28),0 0 12px rgba(240,180,41,.16);text-shadow:0 0 8px rgba(240,180,41,.55)}

.status{position:relative;z-index:5;margin:0 12px 9px;padding:7px 11px;display:flex;align-items:center;gap:8px;border-radius:13px;border:1px solid rgba(240,180,41,.20);background:linear-gradient(180deg,rgba(26,20,12,.9),rgba(6,5,4,.92));box-shadow:inset 0 1px 0 rgba(255,250,235,.14),inset 0 -6px 12px rgba(0,0,0,.5),0 0 14px rgba(240,180,41,.08)}
.link-status{display:flex;align-items:center;gap:6px;font:700 7px JetBrains Mono,monospace;letter-spacing:.16em;color:var(--ice)}

.ping{margin-left:auto;display:flex;align-items:center;gap:6px;font:700 7px JetBrains Mono,monospace;color:var(--green-2);letter-spacing:.05em}
.ping::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green);animation:blink 1.5s ease infinite}

.screen{position:relative;z-index:5;margin:0 12px;height:160px;border-radius:19px;overflow:hidden;border:1px solid rgba(240,180,41,.38);background:radial-gradient(120% 100% at 50% 0%,rgba(62,44,10,.55),rgba(3,3,2,.99) 70%);box-shadow:inset 0 0 30px rgba(240,180,41,.14),inset 0 1px 0 rgba(255,250,235,.20),inset 0 -14px 26px rgba(0,0,0,.7),0 0 22px rgba(240,180,41,.16),0 6px 18px rgba(0,0,0,.6)}
.screen::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,215,120,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,120,.055) 1px,transparent 1px);background-size:14px 14px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 78%);mask-image:radial-gradient(circle at 50% 50%,#000 25%,transparent 78%)}

.hud-bg{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.aur{position:absolute;border-radius:50%;filter:blur(20px)}
.aur-a{width:125px;height:125px;left:-32px;top:-32px;background:radial-gradient(circle,rgba(240,180,41,.38),transparent 70%);animation:aurA 8s ease-in-out infinite alternate}
.aur-b{width:135px;height:135px;right:-42px;bottom:-42px;background:radial-gradient(circle,rgba(240,180,41,.22),transparent 70%);animation:aurB 10s ease-in-out infinite alternate}
.cyber-grid{position:absolute;inset:-30%;z-index:2;opacity:.25;background-image:linear-gradient(rgba(255,215,120,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,120,.08) 1px,transparent 1px);background-size:18px 18px;transform:perspective(180px) rotateX(58deg) translateY(24%);transform-origin:center bottom}
.cyber-scan{position:absolute;left:4%;right:4%;top:0;height:2px;z-index:5;background:linear-gradient(90deg,transparent,#f0b429 20%,#fff 50%,#ffd76a 80%,transparent);box-shadow:0 0 8px #ffd76a,0 0 18px rgba(240,180,41,.55);animation:cyberSweep 2.5s ease-in-out infinite}
.code-stream{position:absolute;z-index:3;top:10%;width:1px;height:28px;background:linear-gradient(#ffd76a,transparent);box-shadow:0 0 5px #f0b429;animation:codeRain 1.8s linear infinite}
.cs1{left:13%;animation-delay:.1s}.cs2{left:29%;animation-delay:.8s}.cs3{left:71%;animation-delay:.35s}.cs4{left:87%;animation-delay:1.1s}
.hack-label{position:absolute;left:12px;bottom:9px;z-index:3;font:700 5.8px JetBrains Mono,monospace;letter-spacing:.12em;color:#ffd76a;text-shadow:0 0 8px rgba(255,215,120,.7);animation:dataFlicker 2.4s infinite}
.hack-progress{position:absolute;left:12px;right:12px;bottom:5px;height:1px;z-index:3;background:rgba(255,215,120,.12);overflow:hidden}
.hack-progress::after{content:"";display:block;height:100%;background:linear-gradient(90deg,#f0b429,#f0b429,#fff);box-shadow:0 0 7px #ffd76a;animation:hackProgress 2.5s ease-in-out infinite}
.pt{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cyan-2);box-shadow:0 0 6px var(--cyan);animation:twinkle 2.8s ease-in-out infinite}
.p1{left:16%;top:24%}.p2{left:78%;top:20%;animation-delay:.5s}.p3{left:24%;top:72%;animation-delay:1s}.p4{left:84%;top:68%;animation-delay:1.5s}.p5{left:48%;top:14%;animation-delay:2s}.p6{left:62%;top:82%;animation-delay:2.4s}
.radar{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%)}
.radar-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,215,120,.16)}
.radar-ring.r2{inset:23px}.radar-ring.r3{inset:46px}
.radar-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,215,120,0) 0deg,rgba(255,215,120,.32) 52deg,rgba(255,215,120,0) 76deg);-webkit-mask-image:radial-gradient(circle,transparent 24%,#000 25%);mask-image:radial-gradient(circle,transparent 24%,#000 25%);animation:spin 3.4s linear infinite}
.radar-ping{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1.5px solid rgba(255,215,120,.7);animation:radarPing 2.7s ease-out infinite}
.radar-ping.k2{animation-delay:1.35s}
.radar-core{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cyan-2);box-shadow:0 0 10px var(--cyan),0 0 24px rgba(240,180,41,.6);animation:corePulse 1.8s ease-in-out infinite alternate}
.corner{position:absolute;z-index:8;width:16px;height:16px;border:0 solid #ffdf95;opacity:.95;filter:drop-shadow(0 0 5px rgba(240,180,41,.9))}
.tl{left:10px;top:10px;border-width:1.6px 0 0 1.6px;border-top-left-radius:7px}
.br{right:10px;bottom:10px;border-width:0 1.6px 1.6px 0;border-bottom-right-radius:7px}

.state{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:10px}
.state.on{display:flex;animation:stateIn .35s cubic-bezier(.2,1,.3,1) both}
.state-ico{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;margin-bottom:1px}
.big-title{font:800 14px Sora,sans-serif;letter-spacing:.09em;color:var(--ice);text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 14px rgba(255,215,120,.5)}
.pill{padding:6px 15px;border-radius:999px;font:700 7.4px JetBrains Mono,monospace;letter-spacing:.2em;border:1px solid;box-shadow:inset 0 1px 0 rgba(255,250,235,.18),0 2px 8px rgba(0,0,0,.45)}
.info-chip{padding:5px 12px;border-radius:999px;font:700 6.8px JetBrains Mono,monospace;letter-spacing:.13em;border:1px solid;box-shadow:inset 0 1px 0 rgba(255,250,235,.14),0 2px 7px rgba(0,0,0,.4)}

.state-wait .state-ico{color:var(--rose-2);background:radial-gradient(circle at 35% 30%,rgba(251,113,133,.3),rgba(60,10,20,.72));border:1px solid rgba(251,113,133,.45);box-shadow:0 0 18px rgba(251,113,133,.28)}
.state-wait .big-title{color:#ffe4e8;text-shadow:0 0 14px rgba(251,113,133,.55)}
.state-wait .pill{color:var(--rose-2);border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.1)}
.state-wait .info-chip{color:#ffd9a8;border-color:rgba(251,191,36,.42);background:rgba(251,191,36,.08)}

.state-low .state-ico{color:var(--gold-2);background:radial-gradient(circle at 35% 30%,rgba(251,191,36,.3),rgba(58,38,6,.72));border:1px solid rgba(251,191,36,.45);box-shadow:0 0 18px rgba(251,191,36,.28)}
.state-low .big-title{color:#fff2d6;text-shadow:0 0 14px rgba(251,191,36,.55)}
.state-low .pill{color:var(--gold-2);border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.1)}
.state-low .info-chip{color:var(--green-2);border-color:rgba(52,211,153,.42);background:rgba(52,211,153,.08)}

.state-ready .state-ico{color:#ffe6a8;background:radial-gradient(circle at 35% 30%,rgba(255,215,120,.34),rgba(40,27,4,.85));border:1px solid rgba(240,180,41,.55);box-shadow:0 0 20px rgba(240,180,41,.35),inset 0 1px 0 rgba(255,250,235,.35)}
.state-ready .big-title{background:linear-gradient(180deg,#ffffff 0%,#fff6dc 40%,#ffd76a 78%,#f0b429 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.95)) drop-shadow(0 0 3px rgba(0,0,0,.85)) drop-shadow(0 0 14px rgba(240,180,41,.55))}
.state-ready .pill{color:#ffe6a8;border-color:rgba(240,180,41,.5);background:linear-gradient(180deg,rgba(240,180,41,.2),rgba(240,180,41,.05))}
.state-ready .info-chip{color:var(--cyan-3);border-color:rgba(240,180,41,.34);background:linear-gradient(180deg,rgba(240,180,41,.14),rgba(240,180,41,.04))}

/* Scan breach terminal */
.scan-layout{position:absolute;inset:6px;z-index:6;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:14px;border:1px solid rgba(240,180,41,.26);background:linear-gradient(180deg,rgba(255,248,224,.05),transparent 26%),linear-gradient(180deg,rgba(12,10,6,.96),rgba(2,2,1,.98));box-shadow:inset 0 1px 0 rgba(255,250,235,.16),inset 0 -14px 26px rgba(0,0,0,.7)}
.brx-rain{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.brx-col{position:absolute;top:0;width:7px;writing-mode:vertical-rl;text-orientation:upright;font:700 5.4px JetBrains Mono,monospace;letter-spacing:.06em;color:rgba(240,180,41,.55);text-shadow:0 0 6px rgba(240,180,41,.5);animation:brxRain 2.4s linear infinite}
.rc1{left:6%;animation-duration:2.1s}.rc2{left:27%;animation-duration:2.6s;animation-delay:.35s}.rc3{left:50%;animation-duration:1.9s;animation-delay:.7s;opacity:.75}.rc4{left:72%;animation-duration:2.8s;animation-delay:.15s}.rc5{left:91%;animation-duration:2.3s;animation-delay:.9s;opacity:.8}
.brx-sweep{position:absolute;left:0;right:0;top:0;height:2px;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,215,120,.85) 30%,#fffdf2 50%,rgba(255,215,120,.85) 70%,transparent);box-shadow:0 0 10px rgba(240,180,41,.85),0 0 22px rgba(240,180,41,.45);animation:brxSweep 1.5s cubic-bezier(.4,0,.5,1) infinite}
.brx-head{position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:7px;background:linear-gradient(180deg,rgba(240,180,41,.14),rgba(240,180,41,.03));animation:brxHeadPulse 1.3s ease-in-out infinite}
.brx-live{width:4.5px;height:4.5px;border-radius:50%;flex:0 0 auto;background:#ff5f7a;box-shadow:0 0 7px #ff5f7a;animation:blink .7s steps(2,end) infinite}
.brx-target{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font:700 5.8px JetBrains Mono,monospace;letter-spacing:.14em;color:#ffe6a8;text-shadow:0 0 7px rgba(240,180,41,.55);animation:brxGlitch 1.6s steps(1,end) infinite}
.brx-enc{flex:0 0 auto;font:700 5.2px JetBrains Mono,monospace;letter-spacing:.1em;color:#2a1a00;padding:2px 5px;border-radius:999px;background:linear-gradient(180deg,#ffe9b0,#f0b429 70%,#c98a0c);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 8px rgba(240,180,41,.35)}
.brx-term{position:relative;z-index:4;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3.5px;padding:3px 5px}
.brx-line{display:flex;align-items:center;gap:5px;opacity:0;animation:brxLineIn .18s ease forwards}
.brx-txt{display:inline-block;white-space:nowrap;overflow:hidden;width:0;border-right:1.4px solid transparent;font:700 6.6px JetBrains Mono,monospace;letter-spacing:.03em;color:#ffdd93;text-shadow:0 0 6px rgba(240,180,41,.45);animation:brxType .28s steps(22,end) forwards,brxCaret .3s steps(2,end) 3}
.brx-ok{flex:0 0 auto;opacity:0;font:800 5.2px JetBrains Mono,monospace;letter-spacing:.12em;color:#0d0a04;padding:2px 4.5px;border-radius:3.5px;background:linear-gradient(180deg,#fff3cf,#f0b429 65%,#b07c08);box-shadow:0 0 8px rgba(240,180,41,.6),inset 0 1px 0 rgba(255,255,255,.75);animation:brxOk .2s cubic-bezier(.2,1.6,.3,1) forwards}
.bl1{animation-delay:.02s}.bl1 .brx-txt{animation-delay:.02s,.02s}.bl1 .brx-ok{animation-delay:.30s}
.bl2{animation-delay:.34s}.bl2 .brx-txt{animation-delay:.34s,.34s}.bl2 .brx-ok{animation-delay:.62s}
.bl3{animation-delay:.66s}.bl3 .brx-txt{animation-delay:.66s,.66s}.bl3 .brx-ok{animation-delay:.94s}
.bl4{animation-delay:.98s}.bl4 .brx-txt{animation-delay:.98s,.98s}.bl4 .brx-ok{animation-delay:1.26s}
.bl5{animation-delay:1.30s}.bl5 .brx-txt{animation-delay:1.30s,1.30s}.bl5 .brx-ok{animation-delay:1.58s}
.brx-crack{position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:9px;border:1px solid rgba(240,180,41,.22);background:linear-gradient(180deg,rgba(30,23,12,.85),rgba(4,3,2,.9));box-shadow:inset 0 1px 0 rgba(255,250,235,.14)}
.brx-tag{font:800 5px JetBrains Mono,monospace;letter-spacing:.16em;color:var(--muted)}
.brx-reels{display:flex;gap:2.5px;flex:1}
.brx-reel{position:relative;display:block;width:11px;height:16px;overflow:hidden;border-radius:3px;background:rgba(0,0,0,.72);border:1px solid rgba(240,180,41,.32);box-shadow:inset 0 0 6px rgba(240,180,41,.18)}
.brx-reel b{display:block;animation:brxReel 1s steps(var(--brx-steps)) forwards}
.brx-reel u{display:block;height:16px;line-height:16px;text-align:center;text-decoration:none;font:800 10px Sora,sans-serif;color:#fff3d2;text-shadow:0 0 7px rgba(240,180,41,.8)}
.brx-reel::after{content:"";position:absolute;inset:-1px;border-radius:3px;z-index:2;opacity:0;background:radial-gradient(circle,rgba(255,248,224,.85),rgba(240,180,41,.25) 60%,transparent 75%);animation:brxLock .3s ease forwards}
.rr1 b{--brx-steps:14;--brx-end:-224px;animation-duration:1.00s}.rr2 b{--brx-steps:17;--brx-end:-272px;animation-duration:1.22s}.rr3 b{--brx-steps:12;--brx-end:-192px;animation-duration:1.44s}.rr4 b{--brx-steps:19;--brx-end:-304px;animation-duration:1.66s}.rr5 b{--brx-steps:15;--brx-end:-240px;animation-duration:1.88s}.rr6 b{--brx-steps:11;--brx-end:-176px;animation-duration:2.05s}
.rr1::after{animation-delay:.98s}.rr2::after{animation-delay:1.20s}.rr3::after{animation-delay:1.42s}.rr4::after{animation-delay:1.64s}.rr5::after{animation-delay:1.86s}.rr6::after{animation-delay:2.03s}
.brx-pct{display:flex;align-items:flex-start;gap:1px;flex:0 0 auto;font:800 7.6px JetBrains Mono,monospace;color:#ffe6a8;text-shadow:0 0 8px rgba(240,180,41,.7)}
.brx-pct-win{display:block;height:11px;overflow:hidden}
.brx-pct i{display:block;font-style:normal;animation:brxPct 2.2s steps(9,end) forwards}
.brx-pct i u{display:block;height:11px;line-height:11px;text-decoration:none;text-align:right}
.brx-pct em{font-style:normal;opacity:.65;font-size:5.6px}
.brx-bar{position:relative;z-index:4;flex:0 0 4px;border-radius:999px;overflow:hidden;background:rgba(240,180,41,.10);box-shadow:inset 0 0 0 1px rgba(240,180,41,.18)}
.brx-bar i{display:block;height:100%;width:3%;border-radius:999px;background:linear-gradient(90deg,#8a5c05,#f0b429 45%,#fffdf2 78%,#ffd76a);box-shadow:0 0 10px rgba(240,180,41,.9);animation:brxBar 2.35s cubic-bezier(.35,.1,.25,1) forwards}
.brx-granted{position:absolute;left:6px;right:6px;bottom:6px;z-index:8;opacity:0;padding:4px 0;border-radius:8px;text-align:center;white-space:nowrap;font:800 6px JetBrains Mono,monospace;letter-spacing:.2em;color:#2a1a00;background:linear-gradient(180deg,#fff6dc,#ffd76a 45%,#f0b429 75%,#b07c08);box-shadow:0 0 20px rgba(240,180,41,.75),inset 0 1px 0 rgba(255,255,255,.85);animation:brxGranted 2.5s ease-out forwards}

/* Result vault */
#resultState{gap:0;overflow:visible;padding:0;justify-content:center}
#resultState.on{display:flex;animation:resultGate .5s cubic-bezier(.2,1.2,.3,1) both}
.rx-card{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:8px 9px;border-radius:15px;border:1px solid rgba(240,180,41,.34);background:radial-gradient(90% 70% at 18% 0%,rgba(240,180,41,.16),transparent 58%),linear-gradient(180deg,rgba(255,248,224,.06),transparent 24%),linear-gradient(180deg,#12100a 0%,#070604 58%,#020201 100%);box-shadow:inset 0 1px 0 rgba(255,250,235,.2),inset 0 -18px 30px rgba(0,0,0,.7),0 0 22px rgba(240,180,41,.14)}
.rx-gloss{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(116deg,transparent 40%,rgba(255,248,224,.1) 48%,rgba(255,255,255,.16) 51%,transparent 60%);background-size:300% 300%;animation:sheen 5s ease-in-out infinite}
.rx-cnr{position:absolute;width:11px;height:11px;z-index:5;border:0 solid #ffdf95;opacity:.9;filter:drop-shadow(0 0 5px rgba(240,180,41,.9));animation:rxCnr .5s ease both}
.rx-tl{left:5px;top:5px;border-width:1.4px 0 0 1.4px;border-top-left-radius:5px}
.rx-tr{right:5px;top:5px;border-width:1.4px 1.4px 0 0;border-top-right-radius:5px;animation-delay:.06s}
.rx-bl{left:5px;bottom:5px;border-width:0 0 1.4px 1.4px;border-bottom-left-radius:5px;animation-delay:.12s}
.rx-br{right:5px;bottom:5px;border-width:0 1.4px 1.4px 0;border-bottom-right-radius:5px;animation-delay:.18s}
.rx-top{position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;animation:rxDrop .4s cubic-bezier(.2,1,.3,1) .06s both}
.rx-lock{display:inline-flex;align-items:center;gap:5px;font:800 6px JetBrains Mono,monospace;letter-spacing:.2em;color:#ffe6a8;text-shadow:0 0 8px rgba(240,180,41,.6)}
.rx-lock i{width:5px;height:5px;border-radius:50%;background:#3ee08f;box-shadow:0 0 7px #3ee08f;animation:blink 1s ease infinite}
.rx-period{font:700 6px JetBrains Mono,monospace;letter-spacing:.08em;color:#a2977f;padding:2.5px 6px;border-radius:6px;white-space:nowrap;border:1px solid rgba(240,180,41,.2);background:linear-gradient(180deg,rgba(36,28,15,.9),rgba(6,5,3,.9))}
.rx-core{position:relative;z-index:4;flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:9px}
.rx-plate{position:relative;flex:0 0 86px;width:86px;height:86px;display:grid;place-items:center;animation:rxStamp .5s cubic-bezier(.2,1.5,.3,1) .04s both}
.rx-halo{position:absolute;inset:-9px;border-radius:50%;z-index:0;background:radial-gradient(circle,rgba(62,224,143,.45),transparent 66%);filter:blur(7px);animation:haloPulse 1.9s ease-in-out infinite alternate}
.rx-plate.is-red .rx-halo{background:radial-gradient(circle,rgba(255,58,72,.5),rgba(200,20,35,.28) 46%,transparent 68%)}
.rx-spin{position:absolute;inset:-4px;border-radius:50%;z-index:1;background:conic-gradient(from 0deg,transparent 0deg 58%,rgba(62,224,143,.9) 70%,#ffffff 76%,rgba(62,224,143,.9) 82%,transparent 92%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));filter:drop-shadow(0 0 5px rgba(62,224,143,.9));animation:spin 3.2s linear infinite}

      if (d >= 10) { chars[i] = '0'; carry = 1; } else { chars[i] = String(d); carry = 0; }
    }
    if (carry) chars.unshift('1');
    return chars.join('');
  }

    }, { passive: false });
  }

  attach('actionBtn', function () {
    if (currentState === 'wait')  { location.href = REGISTER_URL; return; }
    if (currentState === 'low')   { goState('ready'); runScan(); return; }
    if (currentState === 'ready' || currentState === 'result') {
      if (_lastRouteKind !== 'wingo') { location.href = WINGO_URL; return; }
      runScan();
    }
  });

  attach('hideBtn', function () { closePanel(); });

  /* ============================================================
     OPEN / CLOSE / DRAG
  ============================================================ */
  function openPanel(ax, ay) {
    var r = miniBtn.getBoundingClientRect();
    panel.style.transform = '';
    panel.style.display = 'block';
    // portal reveal animation (rAF wrapped to avoid layout thrash)
    panel.classList.remove('portal-in'); void panel.offsetWidth;
    requestAnimationFrame(function(){ panel.classList.add('portal-in'); });
    var w = panel.offsetWidth || 234;
    var h = panel.offsetHeight || 320;
    var x = Number.isFinite(ax) ? ax : (r.left + r.width / 2);
    var y = Number.isFinite(ay) ? ay : (r.top + r.height / 2);
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
    panel.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px';
    panel.style.top = Math.max(12, Math.min(innerHeight - h - 12, y - h / 2)) + 'px';
    miniBtn.style.display = 'none';
    // portal fx at open point
    firePortal(x, y);
    setTimeout(function(){ panel.classList.remove('portal-in'); }, 560);
  }
  function closePanel() {
    var r = panel.getBoundingClientRect();
    miniBtn.style.right = 'auto'; miniBtn.style.bottom = 'auto';
    miniBtn.style.left = Math.max(8, Math.min(innerWidth - 54, r.left + r.width - 50)) + 'px';
    miniBtn.style.top = Math.max(12, Math.min(innerHeight - 54, r.top + 8)) + 'px';
    panel.style.display = 'none';
    miniBtn.style.display = 'block';
    closeToggleVault();
  }

  /* Panel drag */
  (function () {
    var shell = document.getElementById('panelShell');
    var drag = false, sx = 0, sy = 0, sl = 0, st = 0, nx = 0, ny = 0, raf = 0;
    function blocked(t) { return actionBtn.contains(t) || hideBtn.contains(t) || goldBar.contains(t); }
    function begin(x, y) {
      var r = panel.getBoundingClientRect();
      drag = true; sx = x; sy = y; sl = r.left; st = r.top; nx = 0; ny = 0;
      panel.style.right = 'auto'; panel.style.bottom = 'auto';
      panel.style.left = sl + 'px'; panel.style.top = st + 'px';
      panel.style.transform = 'translate3d(0,0,0)';
      panel.classList.add('dragging');
    }
    shell.addEventListener('mousedown', function (e) { if (blocked(e.target)) return; begin(e.clientX, e.clientY); e.preventDefault(); });
    shell.addEventListener('touchstart', function (e) { if (blocked(e.target)) return; begin(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    function apply() { raf = 0; panel.style.transform = 'translate3d(' + nx + 'px,' + ny + 'px,0)'; }
    function move(x, y) {
      if (!drag) return;
      nx = Math.max(0, Math.min(innerWidth - panel.offsetWidth, sl + x - sx)) - sl;
      ny = Math.max(0, Math.min(innerHeight - panel.offsetHeight, st + y - sy)) - st;
      if (!raf) raf = requestAnimationFrame(apply);
    }
    function end() {
      if (!drag) return;
      drag = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      panel.style.transform = '';
      panel.style.left = (sl + nx) + 'px';
      panel.style.top = (st + ny) + 'px';
      panel.classList.remove('dragging');
    }
    document.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function (e) { if (!drag) return; move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
    document.addEventListener('touchcancel', end);
  })();

  /* Mini drag + open */
  (function () {
    var drag = false, moved = false, sx = 0, sy = 0, sl = 0, st = 0, nx = 0, ny = 0, raf = 0;
    function begin(x, y) {
      var r = miniBtn.getBoundingClientRect();
      drag = true; moved = false; sx = x; sy = y; sl = r.left; st = r.top; nx = 0; ny = 0;
      miniBtn.style.left = r.left + 'px'; miniBtn.style.top = r.top + 'px';
      miniBtn.style.right = 'auto'; miniBtn.style.bottom = 'auto';
      miniBtn.style.transform = 'translate3d(0,0,0)';
      miniBtn.classList.add('dragging');
    }
    miniBtn.addEventListener('mousedown', function (e) { begin(e.clientX, e.clientY); e.preventDefault(); });
    miniBtn.addEventListener('touchstart', function (e) { begin(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    function apply() { raf = 0; miniBtn.style.transform = 'translate3d(' + nx + 'px,' + ny + 'px,0)'; }
    function move(x, y) {
      if (!drag) return;
      var dx = x - sx, dy = y - sy;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
      if (!moved) return;
      nx = Math.max(0, Math.min(innerWidth - miniBtn.offsetWidth, sl + dx)) - sl;
      ny = Math.max(0, Math.min(innerHeight - miniBtn.offsetHeight, st + dy)) - st;
      if (!raf) raf = requestAnimationFrame(apply);
    }
    function end() {
      if (!drag) return;
      var wasMoved = moved;
      drag = false; moved = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      miniBtn.style.transform = '';
      if (wasMoved) { miniBtn.style.left = (sl + nx) + 'px'; miniBtn.style.top = (st + ny) + 'px'; }
      miniBtn.classList.remove('dragging');
      if (!wasMoved) openPanel(sx, sy);
    }
    document.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function (e) { if (!drag) return; move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
    document.addEventListener('touchcancel', end);
  })();


  (function setupFoxIframe(){
    var bg=document.getElementById('foxBgIframe');
    if(!bg) return;
    function fit(){
      var v=window.visualViewport;
      bg.style.width=(v?v.width:innerWidth)+'px';
      bg.style.height=(v?v.height:innerHeight)+'px';
    }
    function tune(){
      try{
        var d=bg.contentDocument;
        if(d && d.documentElement && d.body){
          d.documentElement.style.overscrollBehavior='auto';
          d.body.style.margin='0'; d.body.style.overflowX='hidden';
          d.body.style.touchAction='pan-x pan-y pinch-zoom';
        }
      }catch(e){}
    }
    fit(); tune(); bg.addEventListener('load',tune,{passive:true});
    addEventListener('resize',fit,{passive:true});
    addEventListener('orientationchange',function(){setTimeout(fit,150)},{passive:true});
    if(window.visualViewport) visualViewport.addEventListener('resize',fit,{passive:true});
  })();

  /* ============================================================
     INIT
  ============================================================ */
  setInterval(function () { ping.textContent = (16 + Math.floor(Math.random() * 19)) + 'ms'; }, 1300);
  setInterval(syncRouteAndBalance, 1500);
  window.addEventListener('hashchange', function () { setTimeout(syncRouteAndBalance, 100); });

  fetchHistory();
  setInterval(fetchHistory, 5000);

  miniBtn.style.display = 'block';
  miniBtn.style.visibility = 'visible';
  miniBtn.style.opacity = '1';

  renderToggles();
  syncRouteAndBalance();
  updateUI();
})();

</script>
</body>
